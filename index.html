<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <title>TODO List</title>
</head>

<body>
  <div id="app">
    <div class="relative w-[600px]">

      <div class="todo-input">
        <input type="text" v-model="text" name="todo" maxlength="30" placeholder="請輸入">
        <button v-if="!isEditing" type="button" @click="onAdd" :disabled="isMax">新增</button>
        <button v-if="isEditing" type="button" @click="onSave">儲存</button>
        <button type="button" :class="'!bg-transparent'"  @click="onCancel" v-if="text">取消</button>      
      </div>

      <div class="absolute w-full">
        <ul class="todo-list">
          <li v-for="(todo, idx) in todos" :key="idx" class="todo-item">
            <div>
              <span class="mr-1 font-mono">{{idx+1}}.</span>
              {{todo}}
            </div>
            <div class="todo-item-actions material-symbols-outlined">
              <button type="button" @click="onEdit(todo,idx)">edit</button>
              <button class="text-green-800" type="button" @click="onFinished(todo,idx)">check</button>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</body>

<script type="module">
  import {
    createApp,
    ref,
    computed
  } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

  createApp({
    setup() {
      const text = ref("");
      const todos = ref([]);
      const editIndex = ref(null);

      const isEditing = computed(() => editIndex.value !== null);
      const isMax = computed(() => todos.value.length >= 5);
      function onAdd() {
        todos.value.push(text.value);
        text.value = "";
      }
      function onEdit(todo, idx) {
        text.value = todo;
        editIndex.value = idx;
        console.log(todo, idx);
      }
      function onSave() {
        if (editIndex.value === null) {
          return;
        }
        clearEdit();

      }

      function onFinished(todo, idx) {
        const isConfirm = confirm(`是否完成: "${todo}"?`);
        if (!isConfirm) return;
        todos.value.splice(idx, 1);
      }

      function onCancel() {
           clearEdit();
         }
      function clearEdit() {
        text.value = "";
        editIndex.value = null;

      }
      function onSave() {

        if (editIndex.value === null) {
          return;
        }
        todos.value[editIndex.value] = text.value;
        text.value = "";
        editIndex.value = null;
        console.log("save");
      }

      return {
        text,
        onAdd,
        todos,
        onEdit,
        onSave,
        editIndex,
        isEditing,
        onCancel,
        onFinished,
        isMax,
      };
    },
  }).mount("#app");
</script>

</html>

<style type="text/tailwindcss">
  body {
    @apply p-0 m-0 h-dvh w-dvw font-sans;
  }

  #app {
    @apply flex flex-col justify-center items-center h-full gap-2;
  }

  .todo-input {
    @apply flex justify-center items-center gap-2 w-full;
  }

  .todo-list {
    @apply flex flex-col divide-y divide-gray-300 w-full list-inside mt-3;
  }

  .todo-item {
    @apply gap-2 inline-flex items-center justify-between hover:bg-gray-100 transition-colors;
  }

  .todo-item-actions {
    @apply inline-flex gap-2;
  }

  .todo-item-actions > button {
    @apply bg-transparent text-base;
  }

  input {
    @apply flex-1 outline rounded py-2 px-3 focus:outline-gray-400 disabled:opacity-50 disabled:bg-gray-200;
  }

  button {
    @apply rounded py-2 px-3 bg-gray-300 text-sm h-full cursor-pointer disabled:opacity-50 disabled:bg-gray-200 disabled:cursor-not-allowed;
  }
</style>
